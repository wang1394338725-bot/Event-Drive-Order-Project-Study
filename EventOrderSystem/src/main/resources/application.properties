spring.application.name=EventOrderSystem

# ===== MySQL（Docker Compose 容器，宿主机端口 3307，见 compose.yaml）=====
# allowPublicKeyRetrieval=true：MySQL 8 默认 caching_sha2_password 认证，非 SSL 连接需允许取回公钥
spring.datasource.url=jdbc:mysql://localhost:3307/event_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ===== MyBatis-Plus =====
# 控制台打印 SQL，便于学习期观察；后续可注释关闭
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== Redis（compose.yaml 容器，密码 123456）=====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123456

# ===== RabbitMQ（compose.yaml 容器，自建管理员账号）=====
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=event_admin
spring.rabbitmq.password=123456
