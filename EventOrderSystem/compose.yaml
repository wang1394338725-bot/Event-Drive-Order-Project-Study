# 本地开发环境编排（决策 H）：MySQL / Redis / RabbitMQ 三件套
# 启动：docker compose up -d    停止：docker compose down    数据持久化在具名卷中，down 不丢数据
services:
  mysql:
    image: mysql:8.4
    container_name: eventorder-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: event_order        # 启动时自动建库（记录 #004 拍板）
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"                      # 宿主 3307 避让本机直装 MySQL 的 3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    container_name: eventorder-redis
    command: ["redis-server", "--requirepass", "123456"]   # 记录 #004 拍板：设密码
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management         # 带 15672 管理台；guest 在 Docker 下会被拒，须自建账号
    container_name: eventorder-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: event_admin # 记录 #004 拍板
      RABBITMQ_DEFAULT_PASS: "123456"
    ports:
      - "5672:5672"                      # AMQP 收发消息
      - "15672:15672"                    # 管理台：浏览器 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
